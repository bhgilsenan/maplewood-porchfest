<!--
  Maplewood Porchfest — schedule & map embed
  =============================================
  Paste this ENTIRE file into the Squarespace Code Block's HTML source
  (Content tab → Mode: HTML → toggle "Display Source Code" on → paste → Save).

  Self-contained: styles + Leaflet map + full schedule data are all inline,
  so this single paste is the whole widget. Nothing else needs adding to
  the page. Loads Leaflet + Google Fonts (DM Sans) from their public
  CDNs — if this Squarespace plan's Code Block strips
  <link>/<script> tags, move just those three tags (Leaflet CSS+JS, Google
  Fonts) into Settings → Advanced → Code Injection → Header instead, and
  keep the rest (the <div class="pf-embed">…, <style>, and the last
  <script>) in the Code Block.

  Headings use 'kepler-std' (Georgia/serif fallback) — the real site's own
  Adobe Fonts/Typekit serif. Not loadable from a CDN; it only renders
  because this embed's CSS runs inside their actual page, which already
  loads that font kit site-wide. Falls back to Georgia everywhere else
  (including local preview), which is expected, not a bug.

  To update the lineup: edit the PF_DATA object near the bottom of the
  script and re-paste. Source of truth for that data is
  site/src/data/schedule.json in the repo — keep them in sync by hand for
  now.

  The surrounding doctype/html/head/body tags below exist only so this file
  is a valid standalone document for local preview (the live-reload dev
  server needs a proper closing body tag to inject into safely, or it
  corrupts the file — ask if you want the story). Harmless to paste as-is:
  a nested html/head/body inside Squarespace's own page just gets flattened
  away by the browser's parser, so only the real content survives.

  The mobile/desktop layout switch uses a CSS @container query (keyed off
  .pf-embed's own width via container-type: inline-size), not a viewport
  @media query. Squarespace may render this Code Block inside an iframe or
  a narrow page column — a viewport query would respond to that outer box
  instead of the widget's actual rendered width, which is why an earlier
  version of this file didn't re-layout on browser resize once pasted in.

  .pf-embed has an explicit width: 100% (not just max-width: 100%) — under
  container-type: inline-size, a box can fall back to a shrink-to-fit
  intrinsic size instead of stretching to fill its parent if the parent's
  own layout isn't a plain stretch-to-fill block context (Squarespace's
  Code Block wrapper may not be). Without the explicit width, that showed
  up as the whole widget rendering at a static pixel width that ignored
  the surrounding page's responsive column entirely.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maplewood Porchfest — Schedule (local preview)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="pf-embed" id="pf-embed">

  <div class="pf-hero" id="pf-hero">
    <h1 class="pf-hero-title">2026 Schedule</h1>
    <p class="pf-hero-subtitle">
      <span id="pf-hero-date"></span>
      <span class="pf-hero-dot" aria-hidden="true">•</span>
      <span id="pf-hero-hours" class="pf-hero-hours"></span>
    </p>
    <p class="pf-hero-parade-banner" id="pf-hero-parade-banner">
      <span class="pf-hero-parade-icon" aria-hidden="true">🏁</span>
      <span class="pf-hero-parade-copy">
        <strong>Honk Parade</strong>
        <span id="pf-hero-parade-text"></span>
      </span>
    </p>
    <p class="pf-hero-raindate" id="pf-hero-raindate"></p>
  </div>

  <div class="pf-schedule-layout" id="pf-schedule-layout">

    <div class="pf-layer-toggles" id="pf-layer-toggles" role="group" aria-label="Map layers">
      <span class="pf-layer-label">Map:</span>
      <div class="pf-layer-pills">
        <button class="pf-layer-pill pf-layer-pill--active" data-layer="porches" type="button">Music</button>
        <button class="pf-layer-pill pf-layer-pill--active" data-layer="food" type="button">Food</button>
        <button class="pf-layer-pill pf-layer-pill--active" data-layer="lemonade" type="button">Lemonade Stands</button>
        <button class="pf-layer-pill pf-layer-pill--active" data-layer="services" type="button">Services & Facilities</button>
      </div>
      <button class="pf-btn pf-btn--ghost pf-map-toggle-btn" id="pf-map-toggle" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span id="pf-map-toggle-label">Hide Map</span>
      </button>
    </div>

    <div class="pf-map-col pf-map-col--open" id="pf-map-col">
      <div class="pf-map-sticky">
        <div id="pf-map" aria-label="Porch locations map" role="application"></div>
        <div class="pf-map-footer">
          <p class="pf-map-note">Click a marker for lineup times</p>
          <!-- TODO: swap in the real 2026 PDF URL once the committee finalizes it -->
          <a class="pf-btn pf-btn--ghost pf-download-btn" id="pf-map-pdf-link" href="#printable-map-pending">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M20 19H4"/></svg>
            <span class="pf-download-btn-label">Printable Map</span>
          </a>
        </div>
      </div>
    </div>

    <details class="pf-genre-disclosure" id="pf-genre-disclosure">
      <summary class="pf-genre-summary">
        <span class="pf-filter-label">Genre:</span>
        <span class="pf-genre-summary-state" id="pf-genre-summary-state">All</span>
        <svg class="pf-genre-summary-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div class="pf-filter-group" role="group" aria-label="Filter by genre">
        <div class="pf-filter-pills" id="pf-genre-filters">
          <button class="pf-filter-pill pf-filter-pill--active" data-genre="all" type="button">All</button>
        </div>
      </div>
    </details>

    <div class="pf-content-col" id="pf-content-col">

      <div class="pf-view-toggle-row">
        <div class="pf-view-toggle-group">
          <div class="pf-view-toggle" role="group" aria-label="View mode">
            <button class="pf-view-btn pf-view-btn--active" data-view="time" type="button">By Time</button>
            <button class="pf-view-btn" data-view="porch" type="button">By Porch</button>
          </div>
          <select class="pf-filter-select" id="pf-time-filter" aria-label="Filter by time slot">
            <option value="all">All times</option>
            <option value="1">1–2 PM</option>
            <option value="2">2–3 PM</option>
            <option value="3">3–4 PM</option>
            <option value="4">4–5 PM</option>
          </select>
        </div>
        <div class="pf-band-search" id="pf-band-search">
          <input
            type="text"
            class="pf-band-search-input"
            id="pf-band-search-input"
            role="combobox"
            aria-expanded="false"
            aria-haspopup="listbox"
            aria-controls="pf-band-search-listbox"
            aria-autocomplete="list"
            aria-label="Search performers by name"
            placeholder="Search performers…"
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" class="pf-band-search-clear" id="pf-band-search-clear" aria-label="Clear performer search" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
          <ul class="pf-band-search-listbox" id="pf-band-search-listbox" role="listbox" aria-label="Performers" hidden></ul>
        </div>
      </div>

      <div class="pf-schedule-actions-row">
        <!-- TODO: swap in the real 2026 PDF URL once the committee finalizes it -->
        <a class="pf-btn pf-btn--ghost pf-download-btn" id="pf-schedule-pdf-link" href="#printable-schedule-pending">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M20 19H4"/></svg>
          <span class="pf-download-btn-label">Printable Schedule</span>
        </a>
      </div>

      <div id="pf-time-view"></div>
      <div id="pf-porch-view" hidden></div>

    </div>

  </div>
</div>

<style>
.pf-embed {
  /* Brand-constrained palette: every color below is one of
     #93358d (purple) #ff5d00 (vibrant orange) #000000 #e7e7e8 #fafafa
     #ffffff #eeeeef, or an opacity tint of one of those (no other hues
     allowed). Soft amber (#fea30b) is deliberately unused — it's barely
     visible anywhere on the real site despite being all over their CSS. */
  --pf-bg: #ffffff;
  --pf-surface: #ffffff;
  --pf-surface-2: #eeeeef;
  --pf-border: #e7e7e8;
  --pf-text: #000000;
  --pf-text-muted: rgba(0,0,0,.62);
  --pf-text-faint: rgba(0,0,0,.42);

  --pf-primary: #93358d;
  --pf-primary-contrast: #ffffff;
  --pf-primary-soft: rgba(147,53,141,.35);
  --pf-primary-faint: rgba(147,53,141,.08);

  --pf-cta: #ff5d00;
  --pf-cta-contrast: #000000;
  --pf-cta-soft: rgba(255,93,0,.14);

  /* Map wayfinding colors — a deliberate exception to the brand-only rule
     above, scoped to map pins only. Porches keep --pf-cta (orange). Services
     & Facilities pins are grouped by what they mean to someone navigating on
     foot, not one hue per category (9 distinct pin colors would be busy) —
     Parking (highest search-intent) gets its own blue, Park + Playground
     share a green ("head outside"), and Restroom + Community Center + Quiet
     Room share a neutral slate ("functional stop, not a destination"). */
  --pf-food: #c0392b;
  --pf-food-contrast: #ffffff;
  --pf-lemonade: #e8b923;
  --pf-lemonade-contrast: #000000;
  --pf-parking: #2f6fea;
  --pf-parking-contrast: #ffffff;
  --pf-park: #2f9e5b;
  --pf-park-contrast: #ffffff;
  --pf-amenity: #5b6472;
  --pf-amenity-contrast: #ffffff;
  --pf-parade: var(--pf-primary);
  --pf-parade-contrast: #ffffff;

  --pf-radius: 10px;
  --pf-radius-lg: 16px;
  --pf-shadow-sm: 0 1px 2px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.05);
  --pf-shadow-md: 0 6px 20px rgba(0,0,0,.12);

  --pf-font-display: 'kepler-std', Georgia, serif;
  --pf-font-body: 'DM Sans', -apple-system, "system-ui", sans-serif;
  --pf-font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

  background: var(--pf-bg);
  color: var(--pf-text);
  font-family: var(--pf-font-ui);
  line-height: 1.4;
  border-radius: var(--pf-radius-lg);
  padding: 1.25rem;
  width: 100%;
  max-width: 760px;
  margin-inline: auto;
  container-type: inline-size;
}
.pf-embed, .pf-embed *, .pf-embed *::before, .pf-embed *::after { box-sizing: border-box; }
.pf-embed p { margin: 0; }
.pf-embed button, .pf-embed select { font-family: inherit; }

/* ---- hero ---- */
.pf-hero { text-align: center; padding: 1.6rem 0 1.8rem; margin-bottom: 1.4rem; border-bottom: 1px solid var(--pf-border); }
.pf-hero-title { font-family: var(--pf-font-display); font-weight: 400; font-size: 4.2rem; color: var(--pf-text); margin: 0 0 .25rem; }
.pf-hero .pf-hero-subtitle {
  font-size: .95rem; color: var(--pf-text); margin: 0;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; row-gap: .2rem;
}
#pf-hero-date { color: var(--pf-primary); white-space: nowrap; }
.pf-hero-hours { color: var(--pf-text-muted); white-space: nowrap; }
.pf-hero-dot { color: var(--pf-primary); margin: 0 .4rem; font-size: .65rem; vertical-align: middle; }
/* CSS can't detect "this text is about to wrap," so the date/hours break is
   forced at a fixed width instead of left to find its own wrap point —
   guarantees the break always falls cleanly between the two (never mid-date
   or mid-hours) and lets the dot get hidden exactly when it happens. This
   400px threshold is a best guess for where "Sunday, September 6, 2026 •
   1:00 PM – 5:00 PM" actually runs out of room — no browser available to
   confirm live, so nudge it if the two lines split too early or too late. */
@container (max-width: 400px) {
  .pf-hero-subtitle { flex-direction: column; gap: .15rem; }
  .pf-hero-dot { display: none; }
}
.pf-hero .pf-hero-parade-banner {
  display: inline-flex; align-items: flex-start; gap: .55rem; margin: .9rem 0 0;
  padding: .7rem 1.1rem; border-radius: var(--pf-radius); border: 1.5px solid var(--pf-cta);
  background: var(--pf-surface); box-shadow: var(--pf-shadow-sm);
  color: var(--pf-text); font-size: .85rem; font-weight: 400;
  text-align: left;
}
.pf-hero-parade-icon { font-size: 1.1rem; line-height: 1; flex-shrink: 0; margin-top: .1rem; }
.pf-hero-parade-copy { line-height: 1.5; }
.pf-hero-parade-banner strong { font-weight: 700; }
.pf-hero .pf-hero-raindate { font-size: .78rem; color: var(--pf-text-faint); font-style: italic; margin: .7rem 0 1.1rem; }
.pf-view-toggle-group { display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; }

/* ---- genre filter: collapsed by default (progressive disclosure), its own
   bordered container so it reads as a secondary/optional control rather than
   competing at equal weight with the map layers and view toggle above/below it ---- */
.pf-genre-disclosure {
  border: 1.5px solid var(--pf-border); border-radius: var(--pf-radius);
  background: var(--pf-surface-2); margin-bottom: 1.1rem; padding: 0 .9rem;
}
.pf-genre-summary {
  display: flex; align-items: center; gap: .5rem; padding: .7rem 0; cursor: pointer;
  list-style: none; user-select: none;
}
.pf-genre-summary::-webkit-details-marker { display: none; }
.pf-genre-summary-state {
  font-size: .8rem; font-weight: 600; color: var(--pf-primary);
}
.pf-genre-summary-chevron { margin-left: auto; color: var(--pf-text-faint); transition: transform 150ms; flex-shrink: 0; }
.pf-genre-disclosure[open] .pf-genre-summary-chevron { transform: rotate(180deg); }
.pf-filter-group { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; padding: .1rem 0 .9rem; }
.pf-filter-label {
  font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--pf-text-muted); white-space: nowrap; flex-shrink: 0;
}
.pf-filter-pills { display: flex; flex-wrap: wrap; gap: .4rem; }
.pf-filter-pill {
  padding: .3rem .85rem; border-radius: 50px; border: 1.5px solid var(--pf-border);
  background: var(--pf-surface); color: var(--pf-text); font-size: .8rem; font-weight: 600;
  cursor: pointer; transition: background 150ms, border-color 150ms, color 150ms; white-space: nowrap;
}
.pf-filter-pill:hover { border-color: var(--pf-primary); }
.pf-filter-pill--active { background: var(--pf-primary); color: var(--pf-primary-contrast); border-color: var(--pf-primary); }
.pf-genre-clear-btn {
  padding: .3rem .85rem; border-radius: 50px; border: none; background: transparent;
  color: var(--pf-primary); font-size: .8rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background 150ms;
}
.pf-genre-clear-btn:hover { background: var(--pf-primary-soft); }

.pf-filter-select {
  padding: .35rem .75rem; border: 1.5px solid var(--pf-border); border-radius: 50px;
  font-size: .85rem; color: var(--pf-text); background: var(--pf-surface); cursor: pointer;
}

.pf-filter-select:focus { outline: 2px solid var(--pf-primary); outline-offset: 1px; }

/* ---- mobile map toggle ---- */
.pf-btn {
  font-family: var(--pf-font-ui); font-weight: 700; font-size: .85rem; padding: .55rem 1.1rem;
  border-radius: 50px; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: .5rem;
  text-decoration: none; line-height: 1.3;
}
.pf-btn--cta { background: var(--pf-cta); color: var(--pf-cta-contrast); }
.pf-btn--outline { background: transparent; border: 1.5px solid var(--pf-border); color: var(--pf-text); }
.pf-btn--ghost { background: transparent; color: var(--pf-primary); }
.pf-btn--ghost:hover { background: var(--pf-primary-soft); }

/* ---- printable-PDF links: secondary/low-frequency, so they reuse the
   ghost-button language instead of a bespoke style, just smaller than a
   primary ghost button. margin-left: auto docks them to the trailing edge
   of their row even if flex-wrap kicks in, instead of snapping to the
   row's leading edge (which used to read as an orphaned leftover line).
   Below 480px they drop to icon-only entirely — see the shared 480px
   @container block below — so their row stops wrapping in the first
   place rather than needing the trailing-edge fallback at all. ---- */
.pf-download-btn { margin-left: auto; font-size: .78rem; padding: .4rem .85rem; }
.pf-download-btn-label { white-space: nowrap; }

/* ---- layout ---- */
.pf-schedule-layout { display: block; }

.pf-map-col { display: none; }
.pf-map-col--open { display: block; }
.pf-map-sticky { padding-bottom: 1rem; }

.pf-layer-toggles { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem .6rem; margin-bottom: 1.1rem; }
.pf-layer-label {
  font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em;
  color: var(--pf-text-muted); white-space: nowrap; flex-shrink: 0; margin-right: .15rem;
}
.pf-layer-pills { display: flex; flex-wrap: wrap; gap: .35rem; }
.pf-layer-pill {
  padding: .22rem .65rem; border-radius: 50px; border: 1.5px solid var(--pf-border);
  background: var(--pf-surface); color: var(--pf-text); font-family: var(--pf-font-ui);
  font-size: .72rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background 150ms, border-color 150ms, color 150ms;
}
.pf-layer-pill:hover { border-color: var(--pf-primary); }
.pf-layer-pill--active { background: var(--pf-primary); color: var(--pf-primary-contrast); border-color: var(--pf-primary); }
.pf-layer-pill--active::before { content: "✓"; margin-right: .3rem; }
.pf-map-toggle-btn { margin-left: auto; padding: .3rem .85rem; font-size: .78rem; }

@container (max-width: 700px) {
  .pf-layer-label { order: 1; }
  .pf-map-toggle-btn { order: 2; }
  .pf-layer-pills { order: 3; flex-basis: 100%; }
}

#pf-map { height: 320px; border-radius: var(--pf-radius-lg); border: 2px solid var(--pf-border); z-index: 1; }
.pf-map-footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .6rem; margin-top: .6rem; }
.pf-map-note { font-size: .78rem; color: var(--pf-text-faint); font-style: italic; margin: 0; }

.pf-map-marker {
  width: 28px; height: 28px; background: var(--pf-cta); color: var(--pf-cta-contrast); border-radius: 50%;
  border: 2px solid var(--pf-bg); display: flex; align-items: center; justify-content: center;
  font-family: var(--pf-font-display); font-weight: 800; font-size: 11px;
  box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer; transition: background 150ms, transform 150ms;
}
.pf-map-marker:hover { background: var(--pf-primary); color: var(--pf-primary-contrast); transform: scale(1.1); }

.pf-poi-marker {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--pf-bg);
  display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1;
  box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; transition: transform 150ms;
}
.pf-poi-marker svg { width: 14px; height: 14px; flex-shrink: 0; }
.pf-poi-marker:hover { transform: scale(1.15); }
.pf-poi-marker--food { background: var(--pf-food); color: var(--pf-food-contrast); }
.pf-poi-marker--lemonade { background: var(--pf-lemonade); color: var(--pf-lemonade-contrast); }
.pf-poi-marker--parking { background: var(--pf-parking); color: var(--pf-parking-contrast); }
.pf-poi-marker--park { background: var(--pf-park); color: var(--pf-park-contrast); }
.pf-poi-marker--amenity { background: var(--pf-amenity); color: var(--pf-amenity-contrast); }
.pf-poi-marker--parade { background: var(--pf-parade); color: var(--pf-parade-contrast); }
.pf-parade-route { stroke: var(--pf-parade); stroke-opacity: .85; }
.pf-popup-details-link { display: inline-block; margin-top: 6px; color: var(--pf-primary); font-weight: 600; text-decoration: underline; }

/* ---- view toggle row ---- */
.pf-view-toggle-row {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .6rem;
  padding-block: .1rem .6rem;
}
/* Divider lives here, not on .pf-view-toggle-row above, so it closes off the
   whole controls cluster (toggle+select+search+print) as one visual group
   rather than cutting between two rows that both belong together. */
.pf-schedule-actions-row {
  display: flex;
  padding-block: 0 .9rem; border-bottom: 1px solid var(--pf-border); margin-bottom: 1rem;
}

/* ---- band-name search (combobox) ---- */
.pf-band-search { position: relative; flex: 1 1 160px; min-width: 140px; }
.pf-band-search-input {
  width: 100%; padding: .35rem 2rem .35rem .75rem; border: 1.5px solid var(--pf-border); border-radius: 50px;
  font-size: .85rem; color: var(--pf-text); background: var(--pf-surface); font-family: inherit;
}
.pf-band-search-input:focus { outline: 2px solid var(--pf-primary); outline-offset: 1px; }
.pf-band-search-clear {
  position: absolute; top: 50%; right: .4rem; transform: translateY(-50%);
  width: 22px; height: 22px; align-items: center; justify-content: center;
  padding: 0; border: none; border-radius: 50%; background: transparent;
  color: var(--pf-text-faint); cursor: pointer;
}
/* display lives here, not on the base rule above — an unconditional
   display:flex on .pf-band-search-clear would beat the browser's own
   [hidden]{display:none} UA rule (author styles always win over UA styles

  /* ===================== STATE + FILTERS ===================== */
  var activeGenres = new Set(["all"]);

  function slotMatchesTime(slotLabel) {
    if (activeTime === "all") return true;
    var slotStart = 12 + parseInt(activeTime, 10);
    var hour = parseInt(slotLabel, 10);
    return hour === slotStart - 12;
  }

  function timeInSlot(timeStart, timeEnd) {
    if (activeTime === "all") return true;
    var slotStart = 12 + parseInt(activeTime, 10);
    var slotEnd = slotStart + 1;
    return parseHour(timeStart) < slotEnd && parseHour(timeEnd) > slotStart;
  }

  function applyTimeViewFilters() {
    var slots = root.querySelectorAll(".pf-time-slot-section");
    var anyVisible = false;
    slots.forEach(function (slot) {
      if (slot.classList.contains("pf-time-slot-section--parade") && (activeTime !== "all" || activeBand)) {
        slot.style.display = "none";
        return;
      }
      var slotLabel = slot.dataset.slot || "";
      if (slotLabel && !slotMatchesTime(slotLabel)) { slot.style.display = "none"; return; }
      var cards = slot.querySelectorAll(".pf-time-act-card");
      var slotVisible = false;
      cards.forEach(function (card) {
        var genre = card.dataset.genre;
        var genreMatch = activeGenres.has("all") || activeGenres.has(genre);
        var nameMatch = !activeBand || card.dataset.name === activeBand;
        var visible = genreMatch && nameMatch;
        card.style.display = visible ? "" : "none";
        if (visible) { slotVisible = true; anyVisible = true; }
      });
      slot.style.display = slotVisible ? "" : "none";
    });
    var noResults = root.querySelector("#pf-no-results-time");
    if (noResults) noResults.hidden = anyVisible;
  }

  function applyPorchViewFilters() {
    var cards = root.querySelectorAll(".pf-porch-card");
    var visibleCount = 0;
    cards.forEach(function (card) {
      var rows = card.querySelectorAll(".pf-performer-row");
      var cardVisible = false;
      rows.forEach(function (row) {
        var genre = row.dataset.genre;
        var genreMatch = activeGenres.has("all") || activeGenres.has(genre);
        var timeMatch = timeInSlot(row.dataset.timeStart, row.dataset.timeEnd);
        var nameMatch = !activeBand || row.dataset.name === activeBand;
        var visible = genreMatch && timeMatch && nameMatch;
        row.style.display = visible ? "" : "none";
        if (visible) cardVisible = true;
      });
      card.style.display = cardVisible ? "" : "none";
      if (cardVisible) visibleCount++;
    });
    var noResults = root.querySelector("#pf-no-results-porch");
    if (noResults) noResults.hidden = visibleCount > 0;
  }

  function syncMapMarkers() {
    PF_DATA.porches.forEach(function (porch) {
      var marker = markers[porch.id];
      if (!marker) return;
      var visible;
      if (activeView === "time") {
        var cards = root.querySelectorAll('.pf-time-act-card[data-porch-id="' + porch.id + '"]');
        visible = Array.prototype.some.call(cards, function (c) { return c.style.display !== "none"; });
      } else {
        var card = root.querySelector("#pf-porch-" + porch.id);
        visible = card ? card.style.display !== "none" : false;
      }
      var el = marker.getElement();
      if (el) el.style.opacity = visible ? "1" : "0.35";
      marker.setZIndexOffset(visible ? 1000 : 0);
    });
  }

  function applyFilters() {
    if (activeView === "time") applyTimeViewFilters(); else applyPorchViewFilters();
    syncMapMarkers();
  }

  function resetGenreAndTime() {
    activeGenres = new Set(["all"]);
    activeTime = "all";
    root.querySelectorAll(".pf-filter-pill").forEach(function (p) {
      p.classList.toggle("pf-filter-pill--active", p.dataset.genre === "all");
    });
    updateGenreSummary();
    timeFilterEl.value = "all";
  }

  function clearBandSearch() {
    activeBand = null;
    bandSearchInput.value = "";
    bandClearBtn.hidden = true;
  }

  function resetFilters() {
    resetGenreAndTime();
    clearBandSearch();
    applyFilters();
  }

  /* ---- view toggle ---- */
  function setView(view) {
    if (view === activeView) return;
    clearBandSearch();
    activeView = view;
    root.querySelectorAll(".pf-view-btn").forEach(function (b) {
      b.classList.toggle("pf-view-btn--active", b.dataset.view === view);
    });
    timeViewEl.hidden = view !== "time";
    porchViewEl.hidden = view !== "porch";
    applyFilters();
  }

  root.querySelectorAll(".pf-view-btn").forEach(function (btn) {
    btn.addEventListener("click", function () { setView(btn.dataset.view); });
  });

  var backToMapBtn = null;

  function goToPorchCard(porchId) {
    setView("porch");
    var card = root.querySelector("#pf-porch-" + porchId);
    if (!card || card.style.display === "none") return;
    card.scrollIntoView({ behavior: "smooth", block: "start" });
    card.classList.add("pf-porch-card--highlighted");
    setTimeout(function () { card.classList.remove("pf-porch-card--highlighted"); }, 2000);

    if (backToMapBtn) backToMapBtn.remove();
    backToMapBtn = document.createElement("button");
    backToMapBtn.type = "button";
    backToMapBtn.className = "pf-btn pf-btn--outline pf-back-to-map-btn";
    backToMapBtn.textContent = "↑ Back to map";
    backToMapBtn.addEventListener("click", function () {
      if (!mapCol.classList.contains("pf-map-col--open")) {
        mapCol.classList.add("pf-map-col--open");
        mapToggleLabel.textContent = "Hide Map";
        layerLabel.style.display = "";
        layerPills.style.display = "";
        setTimeout(function () { map.invalidateSize(); }, 350);
      }
      var scrollTarget = root.querySelector("#pf-map");
      scrollTarget.scrollIntoView({ behavior: "smooth", block: "start" });
      backToMapBtn.remove();
      backToMapBtn = null;
    });
    card.parentNode.insertBefore(backToMapBtn, card);
  }

  /* ---- genre pills ---- */
  genreFiltersEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".pf-filter-pill");
    if (!btn) return;
    var genre = btn.dataset.genre;
    if (genre === "all") {
      activeGenres = new Set(["all"]);
    } else {
      activeGenres.delete("all");
      if (activeGenres.has(genre)) {
        activeGenres.delete(genre);
        if (activeGenres.size === 0) activeGenres.add("all");
      } else {
        activeGenres.add(genre);
      }
    }
    root.querySelectorAll(".pf-filter-pill").forEach(function (p) {
      var g = p.dataset.genre;
      p.classList.toggle("pf-filter-pill--active", activeGenres.has("all") ? g === "all" : activeGenres.has(g));
    });
    updateGenreSummary();
    clearBandSearch();
    applyFilters();
  });

  genreClearBtn.addEventListener("click", function () {
    activeGenres = new Set(["all"]);
    root.querySelectorAll(".pf-filter-pill").forEach(function (p) {
      p.classList.toggle("pf-filter-pill--active", p.dataset.genre === "all");
    });
    updateGenreSummary();
    clearBandSearch();
    applyFilters();
  });

  /* ---- time filter ---- */
  timeFilterEl.addEventListener("change", function (e) {
    activeTime = e.target.value;
    clearBandSearch();
    applyFilters();
  });

  /* ---- band-name search (ARIA 1.2 editable combobox with list autocomplete) ----
     Selecting an option is the only thing that sets activeBand and re-filters
     the schedule (typing alone only filters this list). Any manual change to
     genre/time/view clears activeBand via clearBandSearch() (see those handlers
     above and setView()/resetFilters()) — selecting a band is symmetrically
     exclusive with the other three filter axes. */
  var bandVisibleEntries = allBands;
  var bandActiveIndex = -1;

  function renderBandOptions(entries) {
    bandVisibleEntries = entries;
    bandActiveIndex = -1;
    bandSearchInput.removeAttribute("aria-activedescendant");
    if (entries.length === 0) {
      bandListboxEl.innerHTML = '<li class="pf-band-search-empty" role="presentation">No performers match</li>';
      return;
    }
    bandListboxEl.innerHTML = entries.map(function (entry, i) {
      return '<li class="pf-band-option" id="pf-band-option-' + i + '" role="option" data-index="' + i + '" aria-selected="false">' +
        '<span class="pf-band-option-name">' + escapeHtml(entry.name) + '</span>' +
        '<span class="pf-band-option-meta">Porch ' + entry.porchId + '</span>' +
      '</li>';
    }).join('');
  }

  function openBandListbox() {
    bandListboxEl.hidden = false;
    bandSearchInput.setAttribute("aria-expanded", "true");
  }

  function closeBandListbox() {
    bandListboxEl.hidden = true;
    bandSearchInput.setAttribute("aria-expanded", "false");
    bandSearchInput.removeAttribute("aria-activedescendant");
    bandActiveIndex = -1;
  }

  function filterBandOptions(query) {
    var q = query.trim().toLowerCase();
    renderBandOptions(!q ? allBands : allBands.filter(function (e) { return e.nameLower.indexOf(q) !== -1; }));
  }

  function setBandActiveIndex(i) {
    var options = bandListboxEl.querySelectorAll(".pf-band-option");
    if (options.length === 0) return;
    if (i < 0) i = options.length - 1;
    if (i >= options.length) i = 0;
    options.forEach(function (opt) {
      opt.classList.remove("pf-band-option--active");
      opt.setAttribute("aria-selected", "false");
    });
    bandActiveIndex = i;
    var active = options[i];
    active.classList.add("pf-band-option--active");
    active.setAttribute("aria-selected", "true");
    bandSearchInput.setAttribute("aria-activedescendant", active.id);
    active.scrollIntoView({ block: "nearest" });
  }

  function syncBandInputToState() {
    var match = activeBand ? allBands.find(function (e) { return e.nameLower === activeBand; }) : null;
    bandSearchInput.value = match ? match.name : "";
    bandClearBtn.hidden = !bandSearchInput.value;
  }

  function selectBand(entry) {
    activeBand = entry.nameLower;
    bandSearchInput.value = entry.name;
    bandClearBtn.hidden = false;
    resetGenreAndTime();
    closeBandListbox();
    applyFilters();
  }

  bandSearchInput.addEventListener("focus", function () {
    filterBandOptions(bandSearchInput.value);
    openBandListbox();
  });

  bandSearchInput.addEventListener("input", function () {
    filterBandOptions(bandSearchInput.value);
    openBandListbox();
    bandClearBtn.hidden = !bandSearchInput.value;
  });

  bandClearBtn.addEventListener("mousedown", function (e) {
    e.preventDefault(); // keep focus on the input, skip the blur/refocus round-trip
  });
  bandClearBtn.addEventListener("click", function () {
    clearBandSearch();
    applyFilters();
    bandSearchInput.focus();
    filterBandOptions("");
    openBandListbox();
  });

  bandSearchInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (bandListboxEl.hidden) { filterBandOptions(bandSearchInput.value); openBandListbox(); }
      setBandActiveIndex(bandActiveIndex + 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (bandListboxEl.hidden) { filterBandOptions(bandSearchInput.value); openBandListbox(); }
      setBandActiveIndex(bandActiveIndex - 1);
    } else if (e.key === "Enter") {
      if (bandListboxEl.hidden) return;
      e.preventDefault();
      if (bandActiveIndex >= 0 && bandVisibleEntries[bandActiveIndex]) {
        selectBand(bandVisibleEntries[bandActiveIndex]);
      } else if (bandVisibleEntries.length === 1) {
        selectBand(bandVisibleEntries[0]);
      }
    } else if (e.key === "Escape") {
      closeBandListbox();
      syncBandInputToState();
    }
  });

  bandListboxEl.addEventListener("mousedown", function (e) {
    var opt = e.target.closest(".pf-band-option");
    if (!opt) return;
    e.preventDefault(); // fires before the input's blur, keeps focus on the input
    var i = parseInt(opt.dataset.index, 10);
    if (bandVisibleEntries[i]) selectBand(bandVisibleEntries[i]);
  });

  bandSearchInput.addEventListener("blur", function () {
    closeBandListbox();
    syncBandInputToState();
  });

  /* ---- clear-filters buttons (delegated, rendered dynamically) ---- */
  root.addEventListener("click", function (e) {
    if (e.target.closest("#pf-no-results-clear-time, #pf-no-results-clear-porch")) resetFilters();
  });

  /* ---- map layer toggles ---- */
  var layerToggles = root.querySelector("#pf-layer-toggles");
  layerToggles.addEventListener("click", function (e) {
    var btn = e.target.closest(".pf-layer-pill");
    if (!btn) return;
    var layer = MAP_LAYERS[btn.dataset.layer];
    if (!layer) return;
    var active = btn.classList.toggle("pf-layer-pill--active");
    if (active) map.addLayer(layer); else map.removeLayer(layer);
  });

  /* ---- mobile map toggle ---- */
  var mapToggleBtn = root.querySelector("#pf-map-toggle");
  var mapToggleLabel = root.querySelector("#pf-map-toggle-label");
  var mapCol = root.querySelector("#pf-map-col");
  var layerLabel = root.querySelector(".pf-layer-label");
  var layerPills = root.querySelector(".pf-layer-pills");
  mapToggleBtn.addEventListener("click", function () {
    var open = mapCol.classList.toggle("pf-map-col--open");
    mapToggleLabel.textContent = open ? "Hide Map" : "Show Map";
    layerLabel.style.display = open ? "" : "none";
    layerPills.style.display = open ? "" : "none";
    setTimeout(function () { map.invalidateSize(); }, 350);
  });

  var backToMapObserver = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting && backToMapBtn) {
      backToMapBtn.remove();
      backToMapBtn = null;
    }
  });
  backToMapObserver.observe(root.querySelector("#pf-map"));

  /* initial paint */
  applyFilters();
  setTimeout(function () { map.invalidateSize(); }, 200);
})();
</script>

</body>
</html>
