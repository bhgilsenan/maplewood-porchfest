/* ---- mobile map toggle ---- */
.pf-map-toggle-bar { display: none; padding-bottom: .9rem; }
.pf-btn {

/* ---- layout ---- */

.pf-map-col { display: none; }

  .pf-view-toggle-row { position: sticky; top: 0; background: var(--pf-bg); z-index: 2; }

@media (max-width: 480px) {

    '</div>';

  timeSlots.forEach(function (slot) {
    timeViewHtml += '<div class="pf-time-slot-section" data-slot="' + escapeHtml(slot.label) + '">' +
      '<h2 class="pf-time-slot-heading">' + escapeHtml(slot.label) + '</h2>' +
      '<div class="pf-time-acts-grid">' +
      slot.acts.map(function (act) {
        return '<div class="pf-time-act-card" data-genre="' + escapeHtml(act.genre) + '" data-name="' + escapeHtml(act.name.toLowerCase()) + '" data-porch-id="' + act.porchId + '">' +
          '<div class="pf-time-act-top">' +
            '<strong class="pf-time-act-name">' + escapeHtml(act.name) + '</strong>' +
            '<span class="pf-genre-pill" data-genre="' + escapeHtml(act.genre) + '">' + escapeHtml(act.genre) + '</span>' +
          '</div>' +
          '<p class="pf-time-act-where">' + PIN_SVG + ' Porch ' + act.porchId + ' · ' + escapeHtml(act.address) + '</p>' +
          '<p class="pf-time-act-desc">' + escapeHtml(act.description) + '</p>' +
        '</div>';
      }).join('') +
      '</div>' +
    '</div>';
  });

  timeViewHtml += '<div class="pf-no-results" id="pf-no-results-time" hidden aria-live="polite">' +
    '<div class="pf-no-results-inner"><span class="pf-no-results-icon" aria-hidden="true">🎵</span>' +
    '<h3>No performers found</h3><p>Try clearing the filters to see the full schedule.</p>' +
    '<button class="pf-btn pf-btn--outline" id="pf-no-results-clear-time" type="button">Clear all filters</button></div></div>';

  timeViewEl.innerHTML = timeViewHtml;

  var porchViewHtml = PF_DATA.porches.map(function (porch) {
    var genres = porch.performers.map(function (p) { return p.genre; }).join(",");
    var names = porch.performers.map(function (p) { return p.name.toLowerCase(); }).join(",");
    return '<div class="pf-porch-card" id="pf-porch-' + porch.id + '" data-porch-id="' + porch.id + '" data-genres="' + escapeHtml(genres) + '" data-performers="' + escapeHtml(names) + '">' +
      '<div class="pf-porch-card-header">' +
        '<div class="pf-porch-number" aria-label="Porch ' + porch.id + '">' + porch.id + '</div>' +
        '<div class="pf-porch-address-block">' +
          '<h3 class="pf-porch-address">' + escapeHtml(porch.address) + '</h3>' +
          (porch.neighborhood_note ? '<p class="pf-porch-note">' + escapeHtml(porch.neighborhood_note) + '</p>' : '') +
        '</div>' +
      '</div>' +
      '<div class="pf-performer-list">' +
      porch.performers.map(function (perf) {
        return '<div class="pf-performer-row" data-genre="' + escapeHtml(perf.genre) + '" data-name="' + escapeHtml(perf.name.toLowerCase()) + '" data-time-start="' + escapeHtml(perf.time_start) + '" data-time-end="' + escapeHtml(perf.time_end) + '">' +
          '<div class="pf-performer-time">' +
            '<span class="pf-time-start">' + escapeHtml(perf.time_start) + '</span>' +
            '<span class="pf-time-sep">–</span>' +
            '<span class="pf-time-end">' + escapeHtml(perf.time_end) + '</span>' +
          '</div>' +
          '<div class="pf-performer-info">' +
            '<div class="pf-performer-name-row">' +
              '<strong class="pf-performer-name">' + escapeHtml(perf.name) + '</strong>' +
              '<span class="pf-genre-pill" data-genre="' + escapeHtml(perf.genre) + '">' + escapeHtml(perf.genre) + '</span>' +
            '</div>' +
            '<p class="pf-performer-desc">' + escapeHtml(perf.description) + '</p>' +
          '</div>' +
        '</div>';
      }).join('') +
      '</div>' +
    '</div>';
  }).join('');

  porchViewHtml += '<div class="pf-no-results" id="pf-no-results-porch" hidden aria-live="polite">' +
    '<div class="pf-no-results-inner"><span class="pf-no-results-icon" aria-hidden="true">🎵</span>' +
    '<h3>No performers found</h3><p>Try clearing the filters to see the full schedule.</p>' +
    '<button class="pf-btn pf-btn--outline" id="pf-no-results-clear-porch" type="button">Clear all filters</button></div></div>';

  porchViewEl.innerHTML = porchViewHtml;

  /* ===================== MAP ===================== */
  var map = L.map(root.querySelector("#pf-map"), { center: [40.7193, -74.2643], zoom: 15, scrollWheelZoom: false, zoomControl: true });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19
  }).addTo(map);

  var markers = {};
  PF_DATA.porches.forEach(function (porch) {
    var icon = L.divIcon({ html: '<div class="pf-map-marker">' + porch.id + '</div>', className: "", iconSize: [34, 34], iconAnchor: [17, 17] });
    var marker = L.marker([porch.lat, porch.lng], { icon: icon }).addTo(map).bindPopup(
      '<strong>#' + porch.id + ' — ' + escapeHtml(porch.address) + '</strong><br/>' +
      porch.performers.map(function (p) { return escapeHtml(p.name) + ' (' + escapeHtml(p.genre) + ')'; }).join('<br/>')
    );
    marker.on("click", function () {
      if (activeView === "porch") {
        var card = root.querySelector("#pf-porch-" + porch.id);
        if (card && card.style.display !== "none") {
          card.scrollIntoView({ behavior: "smooth", block: "start" });
          card.classList.add("pf-porch-card--highlighted");
          setTimeout(function () { card.classList.remove("pf-porch-card--highlighted"); }, 2000);
        }
      } else {
        root.querySelectorAll('.pf-time-act-card[data-porch-id="' + porch.id + '"]').forEach(function (c) {
          if (c.style.display !== "none") {
            c.scrollIntoView({ behavior: "smooth", block: "nearest" });
            c.classList.add("pf-time-act-card--highlighted");
            setTimeout(function () { c.classList.remove("pf-time-act-card--highlighted"); }, 2000);
          }
        });
      }
    });
    markers[porch.id] = marker;
  });

  /* ===================== STATE + FILTERS ===================== */
  var activeGenres = new Set(["all"]);
  var activeTime = "all";
  var activeView = "time";

  function slotMatchesTime(slotLabel) {
    if (activeTime === "all") return true;
    var slotStart = 12 + parseInt(activeTime, 10);
    var hour = parseInt(slotLabel, 10);
    return hour === slotStart - 12;
  }

  function timeInSlot(timeStart, timeEnd) {
    if (activeTime === "all") return true;
    var slotStart = 12 + parseInt(activeTime, 10);
    var slotEnd = slotStart + 1;
    return parseHour(timeStart) < slotEnd && parseHour(timeEnd) > slotStart;
  }

  function applyTimeViewFilters() {
    var slots = root.querySelectorAll(".pf-time-slot-section");
    var anyVisible = false;
    slots.forEach(function (slot) {
      var slotLabel = slot.dataset.slot || "";
      if (slotLabel && !slotMatchesTime(slotLabel)) { slot.style.display = "none"; return; }
      var cards = slot.querySelectorAll(".pf-time-act-card");
      var slotVisible = false;
      cards.forEach(function (card) {
        var genre = card.dataset.genre;
        var visible = activeGenres.has("all") || activeGenres.has(genre);
        card.style.display = visible ? "" : "none";
        if (visible) { slotVisible = true; anyVisible = true; }
      });
      slot.style.display = slotVisible ? "" : "none";
    });
    var noResults = root.querySelector("#pf-no-results-time");
    if (noResults) noResults.hidden = anyVisible;
  }

  function applyPorchViewFilters() {
    var cards = root.querySelectorAll(".pf-porch-card");
    var visibleCount = 0;
    cards.forEach(function (card) {
      var rows = card.querySelectorAll(".pf-performer-row");
      var cardVisible = false;
      rows.forEach(function (row) {
        var genre = row.dataset.genre;
        var genreMatch = activeGenres.has("all") || activeGenres.has(genre);
        var timeMatch = timeInSlot(row.dataset.timeStart, row.dataset.timeEnd);
        var visible = genreMatch && timeMatch;
        row.style.display = visible ? "" : "none";
        if (visible) cardVisible = true;
      });
      card.style.display = cardVisible ? "" : "none";
      if (cardVisible) visibleCount++;
    });
    var noResults = root.querySelector("#pf-no-results-porch");
    if (noResults) noResults.hidden = visibleCount > 0;
  }

  function syncMapMarkers() {
    PF_DATA.porches.forEach(function (porch) {
      var marker = markers[porch.id];
      if (!marker) return;
      var visible;
      if (activeView === "time") {
        var cards = root.querySelectorAll('.pf-time-act-card[data-porch-id="' + porch.id + '"]');
        visible = Array.prototype.some.call(cards, function (c) { return c.style.display !== "none"; });
      } else {
        var card = root.querySelector("#pf-porch-" + porch.id);
        visible = card ? card.style.display !== "none" : false;
      }
      var el = marker.getElement();
      if (el) el.style.opacity = visible ? "1" : "0.35";
    });
  }

  function applyFilters() {
    if (activeView === "time") applyTimeViewFilters(); else applyPorchViewFilters();
    syncMapMarkers();
  }

  function resetFilters() {
    activeGenres = new Set(["all"]);
    activeTime = "all";
    root.querySelectorAll(".pf-filter-pill").forEach(function (p) {
      p.classList.toggle("pf-filter-pill--active", p.dataset.genre === "all");
    });
    timeFilterEl.value = "all";
    applyFilters();
  }

  /* ---- view toggle ---- */
  root.querySelectorAll(".pf-view-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var view = btn.dataset.view;
      if (view === activeView) return;
      activeView = view;
      root.querySelectorAll(".pf-view-btn").forEach(function (b) {
        b.classList.toggle("pf-view-btn--active", b.dataset.view === view);
      });
      timeViewEl.hidden = view !== "time";
      porchViewEl.hidden = view !== "porch";
      applyFilters();
    });
  });

  /* ---- genre pills ---- */
  genreFiltersEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".pf-filter-pill");
    if (!btn) return;
    var genre = btn.dataset.genre;
    if (genre === "all") {
      activeGenres = new Set(["all"]);
    } else {
      activeGenres.delete("all");
      if (activeGenres.has(genre)) {
        activeGenres.delete(genre);
        if (activeGenres.size === 0) activeGenres.add("all");
      } else {
        activeGenres.add(genre);
      }
    }
    root.querySelectorAll(".pf-filter-pill").forEach(function (p) {
      var g = p.dataset.genre;
      p.classList.toggle("pf-filter-pill--active", activeGenres.has("all") ? g === "all" : activeGenres.has(g));
    });
    applyFilters();
  });

  /* ---- time filter ---- */
  timeFilterEl.addEventListener("change", function (e) {
    activeTime = e.target.value;
    applyFilters();
  });

  /* ---- clear-filters buttons (delegated, rendered dynamically) ---- */
  root.addEventListener("click", function (e) {
    if (e.target.closest("#pf-no-results-clear-time, #pf-no-results-clear-porch")) resetFilters();
  });

  /* ---- mobile map toggle ---- */
  var mapToggleBtn = root.querySelector("#pf-map-toggle");
  var mapToggleLabel = root.querySelector("#pf-map-toggle-label");
  var mapCol = root.querySelector("#pf-map-col");
  mapToggleBtn.addEventListener("click", function () {
    var open = mapCol.classList.toggle("pf-map-col--open");
    mapToggleLabel.textContent = open ? "Hide Map" : "Show Map";
    setTimeout(function () { map.invalidateSize(); }, 350);
  });

  /* initial paint */
  applyFilters();
  setTimeout(function () { map.invalidateSize(); }, 200);
})();
</script>

</body>
</html>
